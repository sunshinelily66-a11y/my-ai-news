name: ai-daily-digest

on:
  schedule:
    - cron: "0 1 * * *"  # 09:00 Beijing
    - cron: "0 9 * * *"  # 17:00 Beijing
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Morning digest (09:00 Beijing)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 1')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_MORNING: ${{ secrets.FEISHU_WEBHOOK_MORNING }}
          FEISHU_WEBHOOK_AFTERNOON: ${{ secrets.FEISHU_WEBHOOK_AFTERNOON }}
          RSSHUB_BASE: ${{ secrets.RSSHUB_BASE }}
        run: python digest.py morning

      - name: Afternoon brief (17:00 Beijing)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 9')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_MORNING: ${{ secrets.FEISHU_WEBHOOK_MORNING }}
          FEISHU_WEBHOOK_AFTERNOON: ${{ secrets.FEISHU_WEBHOOK_AFTERNOON }}
          RSSHUB_BASE: ${{ secrets.RSSHUB_BASE }}
        run: python digest.py afternoon
